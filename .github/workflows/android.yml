name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check the indicator and build the APK
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$SIGNING_KEY_BASE64" ]]; then
            export ROLLINGZ_KEYSTORE="$RUNNER_TEMP/rollingz.jks"
            printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$ROLLINGZ_KEYSTORE"
            export ROLLINGZ_STORE_PASSWORD="$SIGNING_PASSWORD"
            export ROLLINGZ_KEY_ALIAS="$SIGNING_ALIAS"
            export ROLLINGZ_KEY_PASSWORD="${SIGNING_KEY_PASSWORD:-$SIGNING_PASSWORD}"
          fi
          bash test.sh
          bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rollingz-oil-usd-apk
          path: build/rollingz-oil-usd.apk
      - name: Publish versioned GitHub Release
        run: |
          version="$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' AndroidManifest.xml)"
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Release tag must match AndroidManifest.xml versionName" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already published. Increment versionName and versionCode for a new release."
          else
            gh release create "$tag" build/rollingz-oil-usd.apk \
              --target "$GITHUB_SHA" --title "Rolling Z $version" \
              --notes "Native Android charts for DXY versus Brent futures. Includes synchronized inspection, five timeframes, custom rolling windows, offline cache, and a labeled sample mode."
          fi
